<!DOCTYPE html>
<!-- Source of the link-preview image static/images/og/beanwind.png (1200 x 630). After a change, render it again:
     chrome --headless=new --window-size=1200,630 --hide-scrollbars --allow-file-access-from-files
            --screenshot=beanwind.png docs/og-image/og-card.html
     and copy beanwind.png to src/main/resources/static/images/og/. See README "Open Graph". -->
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @font-face { font-family: 'Syne'; font-weight: 400 800;
    src: url('../../src/main/resources/static/fonts/syne-latin.woff2') format('woff2'); }
  @font-face { font-family: 'DM Sans'; font-weight: 300 500;
    src: url('../../src/main/resources/static/fonts/dm-sans-latin.woff2') format('woff2'); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #09090b;
    background-image:
      radial-gradient(ellipse 70% 60% at 50% -5%, rgba(52,211,153,0.22), transparent 70%),
      radial-gradient(ellipse 40% 50% at 100% 100%, rgba(129,140,248,0.12), transparent 70%);
    color: #fff; font-family: 'DM Sans', sans-serif;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 64px 80px;
  }
  .brand { display: flex; align-items: center; gap: 20px; }
  .brand img { width: 72px; height: 72px; border-radius: 16px; }
  .brand span { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 40px; letter-spacing: -0.5px; }
  .pill { display: inline-block; padding: 8px 20px; border-radius: 999px;
    border: 1px solid rgba(16,185,129,0.35); background: rgba(16,185,129,0.10);
    color: #34d399; font-size: 18px; font-weight: 500; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 24px; }
  h1 { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 70px; line-height: 1.05; letter-spacing: -1.5px; white-space: nowrap; }
  .gradient { background: linear-gradient(135deg, #34d399, #06b6d4, #818cf8);
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .footer { display: flex; justify-content: space-between; align-items: baseline; }
  .slogan { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 34px; color: #34d399; }
  .sub { font-size: 24px; font-weight: 300; color: #a1a1aa; margin-top: 8px; }
  .url { font-size: 22px; color: #71717a; }
</style>
</head>
<body>
  <div class="brand">
    <img src="../../src/main/resources/static/images/favicon/favicon.svg" alt="">
    <span>Beanwind</span>
  </div>
  <div>
    <div class="pill">Spring Boot + JTE + Tailwind</div>
    <h1>Build Beautiful<br><span class="gradient">Java Web Apps</span></h1>
  </div>
  <div class="footer">
    <div>
      <div class="slogan">One JAR. Whole UI.</div>
      <div class="sub">No React. No Node.js. No npm. Pure Java.</div>
    </div>
    <div class="url">beanwind.zeybekyilmazltd.com</div>
  </div>
</body>
</html>
