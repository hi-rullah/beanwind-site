# Template for local secrets — like .env.example in a JavaScript frontend.
# Copy to secret.yml (gitignored) and fill in real values:
#   copy secret.example.yml secret.yml
# Any application property can be overridden here.

backend:
  api-key: change-me

# Signs the login cookie; optional locally (a random key is used when not set). At least 32 characters.
# auth:
#   cookie-secret: change-me-to-a-long-random-string-of-32-chars-or-more

# OAuth2 login (only once enabled, see SecurityConfig). Fills the ${...} placeholders in application.yml.
# GITHUB_CLIENT_ID: change-me
# GITHUB_CLIENT_SECRET: change-me
# GOOGLE_CLIENT_ID: change-me
# GOOGLE_CLIENT_SECRET: change-me
