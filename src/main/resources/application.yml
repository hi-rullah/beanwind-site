spring:
  profiles:
    active: prod
  config:
    # Local secrets (gitignored, never packaged into the jar). Copy secret.example.yml to secret.yml.
    # On a server, use environment variables instead, e.g. BACKEND_API_KEY.
    import: optional:file:./secret.yml

  # Login with GitHub / Google — prepared, not enabled (see SecurityConfig for all steps).
  # Spring Security already knows both providers' endpoints, so only the client ID/secret are needed.
  # Callback URL to register with the provider: {base-url}/login/oauth2/code/github (or .../google),
  # e.g. http://localhost:8080/login/oauth2/code/github. A GitHub OAuth App allows one callback URL,
  # so register one app for localhost and one for the deployed URL.
  # Secrets: secret.yml locally, environment variables on a server — never commit them.
  #  security:
  #    oauth2:
  #      client:
  #        registration:
  #          github:            # GitHub → Settings → Developer settings → OAuth Apps
  #            client-id: ${GITHUB_CLIENT_ID}
  #            client-secret: ${GITHUB_CLIENT_SECRET}
  #          google:            # Google Cloud Console → APIs & Services → Credentials → OAuth client ID
  #            client-id: ${GOOGLE_CLIENT_ID}
  #            client-secret: ${GOOGLE_CLIENT_SECRET}
  #            scope: openid, profile, email

server:
  error:
    whitelabel:
      # Show our error.jte page instead of Spring Boot's "Whitelabel Error Page"
      enabled: false

# Key that signs the login cookie, at least 32 characters. Not set locally: a random key is used (sign-ins are lost
# on restart). Prod requires it, see application-prod.yml. Can also be set in secret.yml.
# auth:
#   cookie-secret: ...

# Backend service (separate repo) that this frontend calls over HTTP. See docs/architecture.md
backend:
  base-url: ${BACKEND_BASE_URL:http://localhost:8081}
  # api-key: set in secret.yml or via the BACKEND_API_KEY environment variable
