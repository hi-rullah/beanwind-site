server:
  port: ${PORT:8080}
  # Behind the Lambda Function URL + Web Adapter, Tomcat only sees plain http from localhost.
  # Trust X-Forwarded-Proto/-For from local proxies so redirects use https and getRemoteAddr() is the visitor.
  forward-headers-strategy: native

spring:
  web:
    resources:
      cache:
        # Let browsers cache css/js/fonts/images; Spring Security would otherwise send "no-store"
        cachecontrol:
          max-age: 1h

gg:
  jte:
    development-mode: false
    use-precompiled-templates: true
